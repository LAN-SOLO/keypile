[package]
name = "keypile-core"
version = "0.2.1"
edition = "2021"
description = "keypile vault engine: format, crypto, merge — one implementation for all platforms"
license = "MIT"

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base32 = "0.5"
base64 = "0.22"
zxcvbn = "3"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
